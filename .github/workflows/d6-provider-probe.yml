name: D6 provider probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d6-provider-probe.yml"
      - "scripts/d6-provider-probe.mjs"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Overpass providers
        run: node scripts/d6-provider-probe.mjs

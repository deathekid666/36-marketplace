name: Global studio business contacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-studio-contacts.yml"
      - "scripts/import-global-studio-business-contacts.py"
  workflow_dispatch:
    inputs:
      max_records:
        description: "Maximum records per region after country balancing (0 = all)"
        required: false
        default: "0"
      country_limit:
        description: "Maximum candidate rows per country (0 = all)"
        required: false
        default: "500"
  schedule:
    - cron: "20 4 25 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: global-studio-business-contact-import
  cancel-in-progress: true

jobs:
  import:
    name: import-${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - region: africa
            bbox: "-20,-36,55,38"
            countries: "DZ,AO,BJ,BW,BF,BI,CV,CM,CF,TD,KM,CD,CG,CI,DJ,EG,GQ,ER,SZ,ET,GA,GM,GH,GN,GW,KE,LS,LR,LY,MG,MW,ML,MR,MU,MA,MZ,NA,NE,NG,RW,ST,SN,SC,SL,SO,ZA,SS,SD,TZ,TG,TN,UG,ZM,ZW,EH"
          - region: europe
            bbox: "-25,34,45,72"
            countries: "AL,AD,AT,BY,BE,BA,BG,HR,CY,CZ,DK,EE,FI,FR,DE,GR,HU,IS,IE,IT,XK,LV,LI,LT,LU,MT,MD,MC,ME,NL,MK,NO,PL,PT,RO,RU,SM,RS,SK,SI,ES,SE,CH,UA,GB,VA"
          - region: asia
            bbox: "25,-10,180,82"
            countries: "AF,AM,AZ,BH,BD,BT,BN,KH,CN,GE,HK,IN,ID,IR,IQ,IL,JP,JO,KZ,KW,KG,LA,LB,MO,MY,MV,MN,MM,NP,KP,PS,PH,QA,SA,SG,LK,SY,TW,TJ,TH,TL,TR,TM,AE,UZ,VN,YE"
          - region: north-america
            bbox: "-170,5,-50,85"
            countries: "CA,US,MX,GT,BZ,HN,SV,NI,CR,PA,BS,BB,CU,JM,HT,DO,TT,GD,LC,VC,AG,DM,KN,GL,BM,PM"
          - region: south-america
            bbox: "-85,-60,-30,15"
            countries: "AR,BO,BR,CL,CO,EC,GY,PY,PE,SR,UY,VE,GF,FK"
          - region: oceania
            bbox: "110,-50,180,5"
            countries: "AU,NZ,FJ,PG,SB,VU,NC,PF,WS,TO,KI,FM,MH,PW,NR,TV"

    env:
      REGION_NAME: ${{ matrix.region }}
      COUNTRIES: ${{ matrix.countries }}
      BBOX: ${{ matrix.bbox }}
      MAX_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_records || '0' }}
      COUNTRY_LIMIT: ${{ github.event_name == 'push' && '250' || (github.event_name == 'workflow_dispatch' && inputs.country_limit) || '0' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 "phonenumbers>=8.13,<10"
      - name: Import structured public studio business contacts
        run: python scripts/import-global-studio-business-contacts.py

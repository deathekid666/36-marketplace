name: Global studio business contacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-studio-contacts.yml"
      - "scripts/import-global-studio-business-contacts.py"
  workflow_dispatch:
    inputs:
      max_records:
        description: "Maximum structured business contacts to import (0 = all)"
        required: false
        default: "0"
  schedule:
    - cron: "20 4 25 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: global-studio-business-contact-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAX_RECORDS: ${{ github.event_name == 'push' && '0' || (github.event_name == 'workflow_dispatch' && inputs.max_records) || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1
      - name: Import structured public studio business contacts
        run: python scripts/import-global-studio-business-contacts.py

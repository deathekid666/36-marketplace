name: Expand 36 Marketplace source

on:
  push:
    paths:
      - '.bootstrap2/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, itertools
          from pathlib import Path

          target = "761af4c90955fcc11ea0afbcafa9e463698ae39e88126b252449784747a8215e"
          parts = sorted(Path(".bootstrap2").glob("part*.b64"))
          raw = "".join(p.read_text() for p in parts)
          raw = "".join(raw.split())
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"

          candidates = [""]
          rem = len(raw) % 4
          need = (-len(raw)) % 4
          if need == 1:
              candidates += list(alphabet)
          elif need == 2:
              candidates += ["=="]
              candidates += [c + "=" for c in alphabet]
              candidates += ["".join(x) for x in itertools.product(alphabet, repeat=2)]
          elif need == 3:
              candidates += ["="]
              candidates += [c + "==" for c in alphabet]
              candidates += ["".join(x) + "=" for x in itertools.product(alphabet, repeat=2)]
              candidates += ["".join(x) for x in itertools.product(alphabet, repeat=3)]

          for suffix in candidates:
              try:
                  data = base64.b64decode(raw + suffix, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(data).hexdigest() == target:
                  Path("/tmp/source.zip").write_bytes(data)
                  print("Recovered archive with suffix length", len(suffix))
                  break
          else:
              raise SystemExit("Could not reconstruct source archive with expected checksum")
          PY
          unzip -o /tmp/source.zip -d .
          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Expand 36 Marketplace source"
            git push
          fi

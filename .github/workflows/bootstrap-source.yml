name: Expand 36 Marketplace source

on:
  push:
    paths:
      - '.bootstrap2/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap2/part*.b64 | base64 -d > /tmp/source.zip
          echo "761af4c90955fcc11ea0afbcafa9e463698ae39e88126b252449784747a8215e  /tmp/source.zip" | sha256sum -c -
          unzip -o /tmp/source.zip -d .
          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Expand 36 Marketplace source"
            git push
          fi

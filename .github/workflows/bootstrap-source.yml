name: Expand 36 Marketplace source

on:
  push:
    paths:
      - '.bootstrap2/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path(".bootstrap2").glob("part*.b64"))
          raw = "".join(p.read_text() for p in parts)
          raw = "".join(raw.split())
          raw += "=" * ((-len(raw)) % 4)
          data = base64.b64decode(raw, validate=True)
          Path("/tmp/source.zip").write_bytes(data)
          print("archive bytes", len(data))
          PY
          unzip -t /tmp/source.zip
          unzip -o /tmp/source.zip -d .
          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Expand 36 Marketplace source"
            git push
          fi

name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/marketplace36
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Test discovery normalization fixtures
        run: |
          rm -rf .tmp-discovery-tests
          npx tsc scripts/test-discovery-normalization.ts lib/discovery/normalization.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-discovery-tests --noEmit false
          node .tmp-discovery-tests/scripts/test-discovery-normalization.js
      - name: Build Next.js
        run: npm run build

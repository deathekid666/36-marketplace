name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/marketplace36
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Test discovery normalization fixtures
        run: |
          rm -rf .tmp-discovery-tests
          npx tsc scripts/test-discovery-normalization.ts lib/discovery/normalization.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-discovery-tests --noEmit false
          node .tmp-discovery-tests/scripts/test-discovery-normalization.js
      - name: Test discovery deduplication fixtures
        run: |
          rm -rf .tmp-dedup-tests
          npx tsc scripts/test-discovery-deduplication.ts lib/discovery/deduplication.ts lib/discovery/normalization.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-dedup-tests --noEmit false --baseUrl .
          node .tmp-dedup-tests/scripts/test-discovery-deduplication.js
      - name: Test OpenStreetMap provider fixtures
        run: |
          rm -rf .tmp-osm-tests
          npx tsc scripts/test-openstreetmap-provider.ts lib/discovery/providers/openstreetmap.ts lib/discovery/normalization.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-osm-tests --noEmit false
          node .tmp-osm-tests/scripts/test-openstreetmap-provider.js
      - name: Test discovery quality and proof URL fixtures
        run: |
          rm -rf .tmp-quality-tests
          npx tsc scripts/test-discovery-quality.ts lib/discovery/quality.ts lib/discovery/freshness.ts lib/discovery/security.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-quality-tests --noEmit false --baseUrl .
          node .tmp-quality-tests/scripts/test-discovery-quality.js
      - name: Test controlled discovery rollout fixtures
        run: |
          rm -rf .tmp-rollout-tests
          npx tsc scripts/test-discovery-rollout.ts lib/discovery/rollout.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-rollout-tests --noEmit false
          node .tmp-rollout-tests/scripts/test-discovery-rollout.js
      - name: Test discovery analytics fixtures
        run: |
          rm -rf .tmp-analytics-tests
          npx tsc scripts/test-discovery-analytics.ts lib/discovery/metrics.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-analytics-tests --noEmit false
          node .tmp-analytics-tests/scripts/test-discovery-analytics.js
      - name: Test global timezone fixtures
        run: |
          rm -rf .tmp-timezone-tests
          npx tsc scripts/test-timezones.ts lib/time.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-timezone-tests --noEmit false
          node .tmp-timezone-tests/scripts/test-timezones.js
      - name: Test global commerce fixtures
        run: |
          rm -rf .tmp-commerce-tests
          npx tsc scripts/test-global-commerce.ts lib/commerce.ts --module commonjs --moduleResolution node --target ES2020 --esModuleInterop --skipLibCheck --outDir .tmp-commerce-tests --noEmit false
          node .tmp-commerce-tests/scripts/test-global-commerce.js
      - name: Build Next.js
        run: npm run build

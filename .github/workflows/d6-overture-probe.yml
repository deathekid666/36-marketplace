name: D6 Overture probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d6-overture-probe.yml"
      - "scripts/d6-overture-probe.mjs"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Overture client
        run: pip install --disable-pip-version-check overturemaps

      - name: Download Casablanca Overture places
        run: |
          mkdir -p tmp
          overturemaps download \
            --bbox=-7.75,33.45,-7.45,33.70 \
            --type=place \
            -f geojson \
            -o tmp/casablanca-places.geojson

      - name: Inspect studio candidates
        run: node scripts/d6-overture-probe.mjs tmp/casablanca-places.geojson
